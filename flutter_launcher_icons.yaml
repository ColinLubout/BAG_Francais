# App icons for iOS and Android. After changing the images in
# assets/branding/, regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  # The App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
  min_sdk_android: 26
  # Adaptive icon: the character on a plain teal layer.
  adaptive_icon_background: "#6EC9C8"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
